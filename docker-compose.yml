services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-baseball-app
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    ports:
      - "7373:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - REDIS_URL=redis://redis:6379
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - NODE_ENV=${NODE_ENV:-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - travel-baseball

  db:
    image: postgres:16-alpine
    container_name: travel-baseball-db
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    environment:
      - POSTGRES_DB=travel_baseball
      - POSTGRES_USER=coach
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d travel_baseball"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-baseball

  redis:
    image: redis:7-alpine
    container_name: travel-baseball-redis
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - travel-baseball

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local

networks:
  travel-baseball:
    driver: bridge
